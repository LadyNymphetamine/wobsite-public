<!DOCTYPE HTML>
<html>
<head>
    <title>portfolio // arcanosis</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        function showRenovation(image) {
            const card = image.parentElement;
            image.remove();
            card.classList.add('gallery-item--empty');
            const label = document.createElement('b');
            label.textContent = 'UNDER RENOVATION';
            card.appendChild(label);
        }
    </script>
</head>
<body style="background-image: url('../../gravitron.jpg'); background-size: cover; background-attachment: fixed; min-height: 100vh; margin: 0; font-family: monospace; color: #CEAAFF;">

    <div class="nav-header">
        <a href="../../index.html" class="nav-link">&lt;&lt; BACK HOME</a>
        <div class="header-main">
            <h1>GALLERY // LIVE MUSIC</h1>
            <div class="audio-capsule">
                <audio id="stream-player" src="https://streaming.live365.com/a49483" preload="none"></audio>
                <button class="control-btn" id="play-toggle" type="button" aria-label="Play radio">
                    <span aria-hidden="true">&#x25B6;</span>
                </button>
                <span class="time-stamp" aria-label="Stream elapsed time">0:00</span>
                <span class="live-label">LIVE RADIO</span>
                <div class="volume-zone">
                    <label class="volume-icon" for="volume-slider" aria-hidden="true">&#x1F50A;</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" aria-label="Radio volume">
                </div>
                <span class="player-status" id="player-status" role="status" aria-live="polite"></span>
            </div>
        </div>
    </div>

    <div class="gallery-grid">
        <div class="gallery-item"><img src="/Photos/gallery-01.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-02.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-03.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-04.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-05.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-06.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-07.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
        <div class="gallery-item"><img src="/Photos/gallery-08.jpg" alt="Live Music Photography" onerror="showRenovation(this)"></div>
    </div>

<style>
/* Header container with a semi-transparent dark gloss */
.nav-header {
    background-color: rgba(0, 0, 0, 0.7);
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid white;
    margin-bottom: 40px;
}

.nav-link {
    color: #FFFFFF;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 10px;
}

.nav-link:hover {
    color: #CEAAFF;
    text-shadow: 0 0 5px #CEAAFF;
}

h1 {
    margin: 10px 0 0 0;
    letter-spacing: 2px;
}

/* Constrained Desktop Grid Layout */
.gallery-grid {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 60px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
    gap: 25px;
}

/* Individual Image Frame Borders */
.gallery-item {
    border: 2px solid white;
    background-color: rgba(0, 0, 0, 0.6);
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

/* Forces giant files to scale dynamically down to fit their cards */
.gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
}

.gallery-item--empty {
    min-height: 250px;
    text-align: center;
}

/* Staggered glow styling on hover */
.gallery-item:hover {
    transform: scale(1.02);
    border-color: #CEAAFF;
    box-shadow: 0 0 15px rgba(206, 170, 255, 0.6);
}

/* Responsive mobile adjustments */
@media (max-width: 500px) {
    .gallery-grid {
        grid-template-columns: 1fr;
    }
}
</style>
<style>
.audio-capsule {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 30, 30, 0.75);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #ffffff;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 9999;
}

.control-btn {
    background: none;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
}

.progress-line {
    width: 120px;
    height: 3px;
    background: rgba(255, 255, 255, 0.5); 
    border-radius: 2px;
}

.time-stamp {
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
}

.volume-zone {
    display: flex;
    align-items: center;
    gap: 0;
    transition: gap 0.2s ease;
}

/* Custom Volume Slider Track (The line it rides on) */
#volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 0;
    opacity: 0;
    height: 4px; 
    background: #FFFFFF !important; /* Forces the track line to be bright solid white */
    border-radius: 2px;
    outline: none;
    transition: width 0.25s ease-in-out, opacity 0.2s ease;
}

/* Custom Slider Knob (The circle you grab) */
#volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none !important;
    appearance: none !important;
    width: 14px; /* Slightly larger circle so it's easier to grab */
    height: 14px;
    border-radius: 50%;
    background-color: #CEAAFF !important; /* Sharp accent purple */
    box-shadow: 0 0 6px rgba(206, 170, 255, 0.8); /* Gives the purple knob a nice clean glow */
    cursor: pointer;
    margin-top: -5px; /* Aligns it perfectly over the center of the track line */
}

/* Firefox Track Support */
#volume-slider::-moz-range-track {
    background: #FFFFFF !important;
    height: 4px;
    border-radius: 2px;
}

/* Firefox Knob Support */
#volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #CEAAFF !important;
    border: none;
    box-shadow: 0 0 6px rgba(206, 170, 255, 0.8);
    cursor: pointer;
}

.volume-zone:hover {
    gap: 8px;
}

.volume-zone:hover #volume-slider {
    width: 80px;
    opacity: 1;
}
</style>
<style>
.header-main {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
}

.header-main h1 {
    grid-column: 2;
}

.audio-capsule {
    position: static;
    grid-column: 3;
    justify-self: end;
    transform: none;
    padding: 8px 12px;
    gap: 8px;
    font-size: 12px;
}

.control-btn {
    min-width: 36px;
    min-height: 36px;
    justify-content: center;
}

.control-btn:focus-visible,
#volume-slider:focus-visible {
    outline: 2px solid #CEAAFF;
    outline-offset: 3px;
}

.time-stamp,
.live-label {
    white-space: nowrap;
}

.live-label {
    color: #CEAAFF;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.08em;
}

.volume-zone {
    gap: 6px;
}

#volume-slider {
    width: 64px;
    opacity: 1;
}

.player-status {
    max-width: 120px;
    color: #ffd1d1;
    font-size: 11px;
}

@media (max-width: 760px) {
    .header-main {
        grid-template-columns: 1fr;
        justify-items: center;
    }

    .header-main h1,
    .audio-capsule {
        grid-column: 1;
    }

    .audio-capsule {
        justify-self: center;
    }

    .header-main h1 {
        font-size: clamp(1.1rem, 5vw, 2rem);
    }
}

@media (max-width: 500px) {
    .audio-capsule {
        gap: 6px;
        padding: 6px 8px;
    }

    #volume-slider {
        width: 52px;
    }
}
</style>

<script>
const audio = document.getElementById('stream-player');
const volumeSlider = document.getElementById('volume-slider');
const playToggle = document.getElementById('play-toggle');
const timeStamp = document.querySelector('.time-stamp');
const playerStatus = document.getElementById('player-status');
const playIcon = playToggle.querySelector('span');

audio.volume = Number(volumeSlider.value);

volumeSlider.addEventListener('input', () => {
    audio.volume = Number(volumeSlider.value);
});

playToggle.addEventListener('click', () => {
    if (audio.paused) {
        playerStatus.textContent = '';
        audio.play().catch(() => {
            playerStatus.textContent = 'Unable to start radio.';
        });
    } else {
        audio.pause();
    }
});

audio.addEventListener('play', () => {
    playIcon.textContent = '\u23F8';
    playToggle.setAttribute('aria-label', 'Pause radio');
});

audio.addEventListener('pause', () => {
    playIcon.textContent = '\u25B6';
    playToggle.setAttribute('aria-label', 'Play radio');
});

audio.addEventListener('error', () => {
    playerStatus.textContent = 'Radio stream is unavailable.';
});

audio.addEventListener('timeupdate', () => {
    const minutes = Math.floor(audio.currentTime / 60);
    const seconds = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
    timeStamp.textContent = `${minutes}:${seconds}`;
});
</script>
</body>
</html>
